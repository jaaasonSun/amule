name: Native Apple CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  swift:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: SwiftEC tests
        run: cd native-macos/AMuleNativeRemote/SwiftEC && swift test

      - name: SwiftEC dependency boundary check
        run: cd native-macos/AMuleNativeRemote/SwiftEC && ./Scripts/check-forbidden-deps.sh

      - name: Shared package tests
        run: cd native-macos/AMuleNativeRemote/Packages/Shared && swift test

      - name: Native macOS tests
        run: cd native-macos/AMuleNativeRemote && swift test

      - name: Native macOS strict build
        run: cd native-macos/AMuleNativeRemote && swift build -Xswiftc -warnings-as-errors

      # Packaging smoke: validates the native SwiftEC-backed macOS app bundle shape and Info.plist.
      - name: Packaging smoke
        run: cd native-macos/AMuleNativeRemote && ./scripts/build-app.sh && plutil -lint "dist/aMule Remote.app/Contents/Info.plist"

      # CI Limitations documented:
      # - iOS simulator/device tests require Xcode device runtime or signed app.
      #   Not included in PR CI. Manual QA: build with xcodebuild per README.
